<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c547;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern sutil -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Linha accent top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- Conteúdo -->
  <text x="100" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#c9a84c" letter-spacing="6" text-transform="uppercase" font-weight="600">ENSINAMENTOS DA VIDA</text>
  <text x="100" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#f5f5f0" font-weight="500" font-style="italic">Você não precisa de</text>
  <text x="100" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#c9a84c" font-weight="500" font-style="italic">motivação. Precisa de sistema.</text>
  <!-- Separador -->
  <rect x="100" y="430" width="120" height="3" fill="#c9a84c" opacity="0.6"/>
  <!-- Subtítulo -->
  <text x="100" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a0a0" font-weight="400">Conteúdo profundo com raciocínio lógico.</text>
  <text x="100" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a0a0" font-weight="400">Pra quem cansou de autoajuda fofa.</text>
  <!-- Domínio -->
  <text x="100" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#666" letter-spacing="3" font-weight="600">ENSINAMENTOSDAVIDA.COM.BR</text>
</svg>
